<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line tells mobile browsers to use the device's actual width -->
  <!-- Without it, responsive design / media queries won't work properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrightPath - Landing Page</title>

  <!-- Linking our external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <div class="logo">BrightPath</div>

      <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#features">Features</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- ===== HERO SECTION ===== -->
  <section class="hero" id="home">
    <div class="container hero-content">
      <h1>Learn to Build the Web, One Page at a Time</h1>
      <p>
        A simple, responsive landing page built with plain HTML and CSS,
        so you can see exactly how every part works.
      </p>
      <a href="#contact" class="btn-primary">Get Started</a>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; 2026 BrightPath. All rights reserved.</p>

      <div class="social-links">
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>
  </footer>

</body>
</html>
